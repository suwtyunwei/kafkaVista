services:
  kafkavista-server:
    image: crpi-y1il03c3mx8rejur.cn-hangzhou.personal.cr.aliyuncs.com/aisoftkit/kafkavista-server:latest
    container_name: kafkavista-server
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      KAFKA_DATABASE_PATH: "/app/data/kafkavista.db"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      LICENSE_ADMIN_TOKEN: "${LICENSE_ADMIN_TOKEN:-}"
      AUTH_DEFAULT_USER: "${AUTH_DEFAULT_USER:-admin}"
      AUTH_DEFAULT_PASSWORD: "${AUTH_DEFAULT_PASSWORD:-admin}"
      KAFKA_CLUSTER_NAME: "${KAFKA_CLUSTER_NAME:-default}"
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}"
      KAFKA_REQUEST_TIMEOUT_MS: "${KAFKA_REQUEST_TIMEOUT_MS:-6000}"
      KAFKA_MAX_POLL_RECORDS: "${KAFKA_MAX_POLL_RECORDS:-50000}"
      KAFKA_MAX_VALUE_LENGTH: "${KAFKA_MAX_VALUE_LENGTH:-1048576}"
      KAFKA_MAX_RESPONSE_BYTES: "${KAFKA_MAX_RESPONSE_BYTES:-10485760}"
      EMAIL_SMTP_HOST: "${EMAIL_SMTP_HOST:-}"
      EMAIL_SMTP_PORT: "${EMAIL_SMTP_PORT:-587}"
      EMAIL_SMTP_USERNAME: "${EMAIL_SMTP_USERNAME:-}"
      EMAIL_SMTP_PASSWORD: "${EMAIL_SMTP_PASSWORD:-}"
      EMAIL_FROM: "${EMAIL_FROM:-}"
      EMAIL_TO: "${EMAIL_TO:-}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-false}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
    volumes:
      - /data/local/kafkaVista/data:/app/data
    ports:
      - "8082:8080"

  kafkavista-web:
    image: crpi-y1il03c3mx8rejur.cn-hangzhou.personal.cr.aliyuncs.com/aisoftkit/kafkavista-web:latest
    container_name: kafkavista-web
    restart: unless-stopped
    depends_on:
      - kafkavista-server
    ports:
      - "3004:80"
